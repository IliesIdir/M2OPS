# CI de la gazette : lint et tests, puis construction de l'image.
# L'image n'est poussée sur ghcr.io que pour un push sur main ; sur les autres branches
# (donc pour une pull request), on la construit sans la pousser.

name: ci

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  lint-et-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.5"

      # On lance le même script qu'en local pour que la CI et le poste de dev ne divergent pas.
      - name: Lint et tests
        run: bin/test

  image:
    needs: lint-et-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Le tag dit d'où vient l'image : date et heure UTC du build, puis le sha court du commit.
      - name: Calcul du tag
        id: tag
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Image : ${image}:${tag}"

      - name: Connexion à ghcr.io
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construction (et envoi sur main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}
