[project]
name = "gazette"
version = "0.1.0"
description = "Pipeline qui lit la presse régionale et nationale et publie chaque matin une édition par thèmes."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "feedparser>=6.0",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# On garde un jeu de règles court : erreurs, imports triés, syntaxe moderne, pièges courants.
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
